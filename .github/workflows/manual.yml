name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create .env from secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          else
            echo "GEMINI_API_KEY secret is not set; falling back to the .env.example placeholder"
            cp .env.example .env
          fi

      # Optional: Firebase config. Without it the google-services plugin only warns
      # (missingGoogleServicesStrategy = WARN) and cloud features stay offline.
      - name: Add google-services.json from secret (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json written from secret"
          else
            echo "GOOGLE_SERVICES_JSON secret not set; building without Firebase config"
          fi

      # Optional: real upload key. Without it the release APK is signed with the debug key.
      - name: Decode release keystore (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
            echo "Release keystore found: release APK will use the upload key"
          else
            echo "RELEASE_KEYSTORE_BASE64 secret not set: release APK will be signed with the debug key (testing only)"
          fi

      - name: Build debug and release APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Save debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SANWOLF-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Save release APK
        uses: actions/upload-artifact@v4
        with:
          name: SANWOLF-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
